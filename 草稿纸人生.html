<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>草稿纸人生 · 初二(3)班</title>
<style>
/* ==========================================================================
   草稿纸人生 — 一张 3 天连着用的草稿纸卷子
   ========================================================================== */
:root{
  --paper:#F6F0DC;
  --paper-2:#FFFBEF;
  --grid:rgba(120,160,190,.20);
  --margin:#E4908C;
  --pen:#3A3830;
  --pen-2:#6B675C;
  --red:#D33F2E;
  --blue:#2F6690;
  --green:#3D8B57;
  --gold:#C08A18;
  --purple:#7A55A0;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:#CFC3A6}
body{
  min-height:100vh;background:#CFC3A6;color:var(--pen);
  font-family:"Hanzipen SC","Xingkai SC","STXingkai","Kaiti SC","KaiTi","PingFang SC",sans-serif;
  font-size:17px;line-height:1.9;-webkit-text-size-adjust:100%;overflow-x:hidden;
}
.paper{
  position:relative;max-width:760px;margin:0 auto;min-height:100vh;
  background:
    linear-gradient(var(--grid) 1px,transparent 1px) 0 0/100% 26px,
    linear-gradient(90deg,var(--grid) 1px,transparent 1px) 0 0/26px 100%,
    var(--paper);
  box-shadow:0 8px 30px rgba(80,60,30,.28);
  padding:0 18px 70px 50px;overflow:hidden;
}
.paper::before{content:"";position:absolute;top:0;bottom:0;left:36px;width:1.6px;background:var(--margin);opacity:.7}
.paper::after{
  content:"";position:absolute;top:0;left:0;bottom:0;width:36px;pointer-events:none;
  background:
    radial-gradient(circle at 18px 150px,rgba(190,170,130,.5) 0 7px,transparent 7px),
    radial-gradient(circle at 18px 500px,rgba(190,170,130,.5) 0 7px,transparent 7px),
    radial-gradient(circle at 18px 850px,rgba(190,170,130,.5) 0 7px,transparent 7px);
}
.tape{
  position:absolute;top:-13px;left:50%;transform:translateX(-50%) rotate(-1.6deg);
  width:190px;height:33px;background:rgba(255,240,180,.62);
  border:1px dashed rgba(140,120,60,.35);z-index:5;
  display:flex;align-items:center;justify-content:center;
  font-size:12px;color:#7A6A32;letter-spacing:3px;box-shadow:0 1px 3px rgba(0,0,0,.08);
}
.head{padding:36px 0 6px;border-bottom:2px solid rgba(58,56,48,.22)}
.h-title{font-size:31px;letter-spacing:3px;line-height:1.25;position:relative;display:inline-block}
.h-title::after{content:"";position:absolute;left:0;right:0;bottom:2px;height:9px;
  background:rgba(224,150,40,.30);z-index:-1;transform:rotate(-.6deg)}
.h-sub{font-size:14px;color:var(--pen-2);margin-top:3px}
.h-row{display:flex;align-items:flex-end;gap:10px;margin-top:9px;flex-wrap:wrap}
.daystamp{border:2.5px solid var(--red);color:var(--red);border-radius:4px;padding:1px 12px;
  font-size:16px;letter-spacing:1px;transform:rotate(-2.2deg)}
.wk{font-size:14px;color:var(--pen-2)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:13px 0 4px}
.stat .lab{font-size:14.5px;display:flex;align-items:baseline;gap:4px}
.stat .lab em{font-style:normal;font-size:20px;font-weight:700;margin-left:auto}
.stat .bar{height:12px;margin-top:2px}
.stat .bar svg{width:100%;height:12px;display:block;overflow:visible}
.stat .hint{font-size:11px;color:var(--pen-2);line-height:1.5}
.friends{display:flex;flex-wrap:wrap;gap:5px 10px;margin:9px 0 2px}
.fr{display:flex;align-items:center;gap:4px;border-bottom:1.6px dashed rgba(58,56,48,.3);padding:0 5px 1px 2px}
.fr .av{width:28px;height:28px;flex:none;overflow:hidden}
.fr .nm{font-size:13.5px}
.fr .ht{font-size:12px;letter-spacing:-1px}

/* 入场动画只用透明度，不用 transform。
   原因：keepQPos 要量 .q 的位置，如果 .q 还在 translateY 动画里，量到的是动画中途的错位，
   补滚之后动画结束内容又挪回去 —— 表现就是"每题必跳一次"。opacity 不影响布局位置。 */
.q{margin-top:18px;position:relative;animation:fadein .3s ease}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.q-no{position:absolute;right:0;top:-7px;font-size:13px;color:var(--pen-2);
  border-bottom:1px solid rgba(58,56,48,.2);padding:0 2px;transform:rotate(3deg)}
.q-head{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;
  border-bottom:1.5px solid rgba(58,56,48,.3);padding-bottom:3px}
.q-time{font-size:22px;font-weight:700;letter-spacing:1px}
.q-place{font-size:16px;color:var(--blue)}
.q-where{font-size:13px;color:var(--pen-2);margin-left:auto}
.q-text{font-size:17.5px;line-height:2.05;margin:9px 0 2px;text-indent:2em}
.q-text b{color:var(--red);border-bottom:2px solid rgba(211,63,46,.32)}
.w{text-decoration:underline wavy rgba(47,102,144,.6) 1.5px;text-underline-offset:4px}
.say{margin:12px 0 2px;display:flex;gap:8px;align-items:flex-start}
.say .av{width:40px;height:40px;flex:none;overflow:hidden;margin-top:2px}
.say .who{font-size:13px;color:var(--blue);line-height:1.4}
.say .bubble{position:relative;background:var(--paper-2);border:2px solid var(--pen);
  border-radius:12px 12px 12px 3px;padding:7px 12px 8px;box-shadow:2.5px 2.5px 0 rgba(58,56,48,.12)}
.say .txt{font-size:16.5px;line-height:1.8;padding:0 0 0 2px}
.sticky{margin:13px 0 0;background:#FFF0A8;box-shadow:2px 3px 6px rgba(0,0,0,.13);
  padding:9px 12px;font-size:15.5px;line-height:1.75;transform:rotate(-.7deg);
  border-left:4px solid rgba(200,150,40,.5)}
.sticky b{color:var(--red)}
.sticky.vio{background:#FFD9D2;transform:rotate(.8deg);border-left-color:var(--red)}
.vow{background:rgba(255,240,168,.45);border:2px dashed rgba(200,150,40,.55);
  border-radius:6px;padding:9px 12px;margin-top:13px}
.vow .vh{font-size:13.5px;color:#8A6A20;letter-spacing:2px}
.vow .vt{font-size:17px}
.vow .badge{display:inline-block;font-size:12.5px;background:rgba(58,56,48,.1);
  border-radius:10px;padding:0 8px;color:var(--pen-2);margin-left:6px;vertical-align:middle}

.ans{margin-top:15px;border:2px dashed rgba(58,56,48,.3);border-radius:6px;padding:9px 11px 11px;position:relative}
.ans::before{content:"答";position:absolute;top:-11px;left:10px;background:var(--paper);
  padding:0 6px;font-size:13px;color:var(--pen-2);letter-spacing:2px}
.opt{position:relative;display:flex;gap:9px;width:100%;text-align:left;font-family:inherit;
  background:none;border:none;border-bottom:1px dotted rgba(58,56,48,.3);
  padding:9px 6px 9px 4px;cursor:pointer;color:var(--pen);line-height:1.6}
.opt:last-child{border-bottom:none}
.opt:hover{background:rgba(255,252,240,.9)}
.opt .k{width:25px;height:25px;flex:none;margin-top:1px;border:2px solid var(--pen);
  display:flex;align-items:center;justify-content:center;font-size:13px;background:var(--paper-2);
  transform:rotate(-2deg)}
.opt .tx{flex:1;min-width:0}
.opt .tx small{display:block;font-size:13.5px;color:var(--pen-2);line-height:1.6;margin-top:1px}
.opt .mk{width:30px;flex:none;align-self:center;font-size:25px;line-height:1;
  opacity:0;transform:scale(.4) rotate(-25deg);transition:all .32s cubic-bezier(.3,1.7,.5,1)}
.opt.picked{background:rgba(255,247,200,.75)}
.opt.picked .k{background:var(--red);color:#fff;border-color:var(--red)}
.opt.picked .mk{opacity:1;transform:none;color:var(--red)}
.opt.wrong{opacity:.62}
.opt.wrong .mk{opacity:1;transform:none;color:rgba(58,56,48,.35)}
.opt.wrong .tx{text-decoration:line-through rgba(58,56,48,.45);color:rgba(58,56,48,.5)}
.opt.wrong .k{background:rgba(58,56,48,.12)}
.opt.lock{pointer-events:none}
.opt .cross{position:absolute;left:0;right:0;top:50%;height:0;pointer-events:none}
.opt .cross svg{position:absolute;left:0;right:0;top:-13px;width:100%;height:26px;overflow:visible}
.opt .cross path{stroke:var(--red);stroke-width:2.4;fill:none;stroke-linecap:round;
  stroke-dasharray:900;stroke-dashoffset:900;animation:cut .5s ease forwards}
@keyframes cut{to{stroke-dashoffset:0}}

.mark{margin-top:14px;border:2.5px solid var(--red);border-radius:5px;
  background:rgba(255,246,244,.75);padding:10px 12px 12px;position:relative;animation:fadein .3s ease}
.mark .stamp{position:absolute;right:8px;top:-12px;background:var(--red);color:#fff;
  font-size:12px;letter-spacing:2px;padding:1px 9px;transform:rotate(-3deg)}
.mark .cmt{font-size:17px;line-height:1.9;color:var(--red);padding-right:76px}
.mark .dlt{display:flex;flex-wrap:wrap;gap:3px 12px;font-size:15px;margin-top:6px;
  padding-top:6px;border-top:1px dashed rgba(211,63,46,.4)}
.d-up{color:var(--green)} .d-dn{color:var(--red)} .d-0{color:var(--pen-2)}
.btn-next{display:block;width:100%;margin-top:12px;font-family:inherit;font-size:17px;
  letter-spacing:3px;padding:10px;border:2.5px solid var(--pen);border-radius:5px;
  background:var(--gold);color:#fff;cursor:pointer;box-shadow:3.5px 3.5px 0 rgba(58,56,48,.2)}
.btn-next:active{transform:translate(2px,2px);box-shadow:1px 1px 0 rgba(58,56,48,.2)}

.logbox{margin-top:20px}
.log-h{font-size:14.5px;letter-spacing:2px;color:var(--pen-2);
  border-bottom:1.5px dashed rgba(58,56,48,.35);padding-bottom:2px;cursor:pointer}
.log-b{padding:6px 2px;font-size:15.5px;max-height:0;overflow:hidden;transition:max-height .3s}
.log-b.on{max-height:280px;overflow-y:auto}
.log-b::-webkit-scrollbar{width:6px}
.log-b::-webkit-scrollbar-thumb{background:rgba(120,100,60,.35);border-radius:3px}
.lg{padding:2px 0;border-bottom:1px dotted rgba(58,56,48,.2)}
.lg .tm{color:var(--blue);font-weight:700;margin-right:5px}
.lg .g{color:var(--green)} .lg .r{color:var(--red)}

.over{position:fixed;inset:0;z-index:80;overflow-y:auto;background:#CFC3A6}
.report{position:relative;max-width:660px;min-height:100vh;margin:0 auto;
  padding:28px 18px 60px 50px;
  background:linear-gradient(var(--grid) 1px,transparent 1px) 0 0/100% 26px,var(--paper);
  box-shadow:0 0 40px rgba(60,40,10,.3)}
.report::before{content:"";position:absolute;top:0;bottom:0;left:36px;width:1.6px;background:var(--margin);opacity:.7}
.rp-k{text-align:center;font-size:13.5px;letter-spacing:5px;color:var(--pen-2)}
.rp-t{text-align:center;font-size:33px;letter-spacing:2px;margin:4px 0 2px;line-height:1.35}
.rp-line{text-align:center;color:var(--red);font-size:17.5px;line-height:1.8;margin:6px 0 16px;
  border-bottom:1.5px solid rgba(211,63,46,.3);padding-bottom:12px}
.rp-card{border:2px solid var(--pen);border-radius:6px;background:rgba(255,251,239,.75);
  padding:12px 14px;margin-bottom:11px;box-shadow:3px 3px 0 rgba(58,56,48,.12)}
.rp-card h4{font-size:15px;letter-spacing:2px;color:var(--blue);margin-bottom:5px;
  display:flex;align-items:center;gap:6px}
.rp-card h4::after{content:"";flex:1;height:1.4px;
  background:repeating-linear-gradient(90deg,rgba(47,102,144,.4) 0 5px,transparent 5px 9px)}
.rp-card p{font-size:16.5px;line-height:1.95;white-space:pre-line}
.rp-bars{display:flex;flex-direction:column;gap:9px}
.rpb{display:flex;align-items:center;gap:8px;font-size:15px}
.rpb .nm{width:78px;flex:none}
.rpb .bar{flex:1;height:13px}
.rpb .bar svg{width:100%;height:13px;overflow:visible}
.rpb .vl{width:32px;text-align:right;font-weight:700}
.rank{text-align:center;font-size:16.5px;margin-top:6px;line-height:1.9}
.grade-big{position:absolute;top:20px;right:8px;transform:rotate(13deg);
  border:4px double var(--red);color:var(--red);font-size:22px;letter-spacing:4px;
  padding:3px 11px;border-radius:7px;opacity:.8;background:rgba(255,251,239,.5)}
.acts{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.big{display:block;width:100%;font-family:inherit;font-size:18px;letter-spacing:2px;padding:10px;
  border:2.5px solid var(--pen);border-radius:5px;background:var(--red);color:#fff;
  cursor:pointer;box-shadow:3.5px 3.5px 0 rgba(58,56,48,.2)}
.big.alt{background:var(--paper-2);color:var(--pen)}
.big.alt2{background:var(--gold);color:#fff}
.big:active{transform:translate(2px,2px);box-shadow:1px 1px 0 rgba(58,56,48,.2)}

.intro{padding-top:36px}
.intro h2{font-size:36px;text-align:center;letter-spacing:4px;position:relative;display:inline-block}
.intro h2::after{content:"";position:absolute;left:-4px;right:-4px;bottom:4px;height:11px;
  background:rgba(224,150,40,.32);z-index:-1;transform:rotate(-.8deg)}
.intro .ct{text-align:center;font-size:14.5px;color:var(--pen-2);margin:2px 0 16px}
.paper-note{border:2px solid var(--pen);border-radius:6px;background:rgba(255,251,239,.8);
  padding:13px 15px;margin-bottom:14px;box-shadow:4px 4px 0 rgba(58,56,48,.13);transform:rotate(-.4deg)}
.paper-note .r{display:flex;gap:8px;font-size:16.5px;line-height:1.85;margin:4px 0}
.paper-note .r i{font-style:normal;color:var(--red);flex:none;font-weight:700}
.paper-note .r b{color:var(--red)}
.tip{text-align:center;font-size:13.5px;color:var(--pen-2);margin-top:12px}

@media(max-width:560px){
  body{font-size:16px}
  .paper,.report{padding-left:44px;padding-right:12px}
  .paper::before,.report::before{left:30px}
  .h-title{font-size:25px}
  .q-time{font-size:19px}
  .stat .lab{font-size:13px}
  .stat .lab em{font-size:17px}
  .rp-t{font-size:26px}
  .mark .cmt{padding-right:0}
  .mark .stamp{position:static;display:inline-block;transform:none;margin-bottom:5px}
  .grade-big{position:static;display:block;width:max-content;margin:0 auto 10px;transform:rotate(-3deg);font-size:19px}
}
</style>
</head>
<body>
<div class="paper">
  <div class="tape">草 稿 纸 人 生</div>
  <div id="app"></div>
</div>

<script>
/* ==========================================================================
   1. 简笔小人（6 发型 / 9 表情 / 6 姿势）
   ========================================================================== */
const SKIN=['#F6D9BE','#EFC49B','#DFA87B','#C98A5C','#F9E3CD'];
const HAIR=['#2B2119','#3E2B1C','#141210','#5A3A22','#8B5A2B'];
const CLOTH=['#D33F2E','#2F6690','#3D8B57','#7A55A0','#C08A18','#5A6670','#C25B8E','#3E8C8C'];
function faceSVG(o){
  o=o||{};
  const skin=SKIN[(o.skin||1)%SKIN.length], hair=HAIR[(o.hair||0)%HAIR.length],
        cloth=CLOTH[(o.cloth!==undefined?o.cloth:0)%CLOTH.length];
  const style=o.style||'short', e=o.expr||'calm';
  const eye=(x,y)=>{
    if(e==='sad')   return `<path d="M${x-4} ${y-2} q4 3 8 0" stroke="#1E1A16" stroke-width="2.2" fill="none" stroke-linecap="round"/>`;
    if(e==='shock') return `<ellipse cx="${x}" cy="${y}" rx="3.4" ry="4.4" fill="#fff" stroke="#1E1A16" stroke-width="1.8"/><circle cx="${x}" cy="${y+1}" r="1.9" fill="#1E1A16"/>`;
    if(e==='evil'||e==='angry') return `<path d="M${x-4} ${y+2} l8 -4" stroke="#1E1A16" stroke-width="2.4" stroke-linecap="round"/>`;
    if(e==='tired') return `<path d="M${x-4} ${y} h8" stroke="#1E1A16" stroke-width="2.2" stroke-linecap="round"/><path d="M${x-4} ${y-4.5} q4 -2 8 0" stroke="#1E1A16" stroke-width="1.5" fill="none"/>`;
    if(e==='grin')  return `<path d="M${x-4} ${y} q4 5 8 0" stroke="#1E1A16" stroke-width="2.2" fill="none" stroke-linecap="round"/>`;
    return `<ellipse cx="${x}" cy="${y}" rx="3.1" ry="3.9" fill="#fff" stroke="#1E1A16" stroke-width="1.8"/><circle cx="${x}" cy="${y+.6}" r="1.8" fill="#1E1A16"/>`;
  };
  const brow=(x,y,t)=>`<path d="${t<0?`M${x-5} ${y-2} l10 2`:`M${x-5} ${y+2} l10 -2`}" stroke="#1E1A16" stroke-width="2" fill="none" stroke-linecap="round" opacity=".85"/>`;
  let eyes=eye(19,34)+eye(37,34), brows='';
  if(e==='angry'||e==='evil') brows=brow(19,26,-1)+brow(37,26,-1);
  if(e==='sad'||e==='shock') brows=brow(19,25,1)+brow(37,25,1);
  let mouth='';
  if(e==='smile') mouth=`<path d="M22 45 q6 5 12 0" stroke="#1E1A16" stroke-width="2.2" fill="none" stroke-linecap="round"/>`;
  if(e==='grin')  mouth=`<path d="M20 44 q8 9 16 0 z" fill="#7A3B33" stroke="#1E1A16" stroke-width="1.8" stroke-linejoin="round"/><path d="M23 44 h10" stroke="#1E1A16" stroke-width="1.4"/>`;
  if(e==='sad')   mouth=`<path d="M22 48 q6 -5 12 0" stroke="#1E1A16" stroke-width="2.2" fill="none" stroke-linecap="round"/>`;
  if(e==='angry') mouth=`<path d="M21 48 q7 -4 14 0" stroke="#1E1A16" stroke-width="2.4" fill="none" stroke-linecap="round"/>`;
  if(e==='shock') mouth=`<ellipse cx="28" cy="47" rx="3.6" ry="4.6" fill="#7A3B33" stroke="#1E1A16" stroke-width="1.7"/>`;
  if(e==='evil')  mouth=`<path d="M20 46 q8 7 16 0" stroke="#1E1A16" stroke-width="2.2" fill="none" stroke-linecap="round"/><path d="M24 46 l1.6 3 l1.6 -3 l1.6 3 l1.6 -3" fill="#1E1A16"/>`;
  if(e==='tired') mouth=`<path d="M23 47 h10" stroke="#1E1A16" stroke-width="2.2" stroke-linecap="round"/>`;
  let hairS=`<path d="M13 33 q0 -19 15 -19 q15 0 15 19 q-4 -9 -15 -8 q-11 -1 -15 8 z" fill="${hair}"/>`;
  if(style==='buzz')  hairS=`<path d="M14 30 q1 -16 14 -16 q13 0 14 16 q-5 -7 -14 -6 q-9 -1 -14 6 z" fill="${hair}"/>`;
  if(style==='long')  hairS=`<path d="M12 36 q-1 -22 16 -22 q17 0 16 22 l-4 24 l-4 -6 l-1 -18 q-4 4 -11 3 q-7 1 -11 -3 l-1 18 l-4 6 z" fill="${hair}"/>`;
  if(style==='twin')  hairS=`<circle cx="8" cy="30" r="6" fill="${hair}"/><circle cx="48" cy="30" r="6" fill="${hair}"/>`+hairS;
  if(style==='curly') hairS=`<circle cx="13" cy="20" r="7" fill="${hair}"/><circle cx="24" cy="13" r="8" fill="${hair}"/><circle cx="38" cy="13" r="8" fill="${hair}"/><circle cx="49" cy="21" r="7" fill="${hair}"/>`+hairS;
  if(style==='cap')   hairS=hairS+`<path d="M11 26 q0 -16 17 -16 q17 0 17 15 l-34 1 z" fill="${cloth}"/><path d="M45 25 l7 4 l-7 1 z" fill="${cloth}"/>`;
  if(style==='hood')  hairS=hairS+`<path d="M8 40 q0 -26 20 -26 q20 0 20 26 l-4 -2 q0 -20 -16 -20 q-16 0 -16 20 z" fill="${cloth}"/>`;
  if(style!=='cap'&&style!=='hood') hairS=hairS+`<path d="M13 33 q0 -19 15 -19 q15 0 15 19 q-4 -9 -15 -8 q-11 -1 -15 8 z" fill="${hair}"/>`;
  const pose=o.pose||'stand';
  const torso=`<path d="M18 60 h20 q7 0 7 8 v16 h-34 v-16 q0 -8 7 -8 z" fill="${cloth}" stroke="#1E1A16" stroke-width="2.2"/>`;
  let body='';
  if(pose==='stand') body=torso+`<path d="M18 66 q-7 8 -7 18" stroke="#1E1A16" stroke-width="2.4" fill="none" stroke-linecap="round"/><path d="M38 66 q7 8 7 18" stroke="#1E1A16" stroke-width="2.4" fill="none" stroke-linecap="round"/><path d="M18 66 q-6 9 -6 18 l6 1 z" fill="${skin}" stroke="#1E1A16" stroke-width="1.8"/><path d="M38 66 q6 9 6 18 l-6 1 z" fill="${skin}" stroke="#1E1A16" stroke-width="1.8"/>`;

   body:'月考 41 分，倒数第五。\n最难受的不是分数，是你看不懂卷子上那些别人都会的题。上课老师提问，你死死盯着本子，希望她叫不到你。回家妈妈问你，你说"我困了"。\n但有一个转机：你把想问的题都记在一个小本子上了，一共 17 道。\n下周，去问苏晴。她今天说了两次谢谢。'},

/* ==========================================================================
   7. 引擎
   ========================================================================== */
const S={day:0,i:0,score:60,mood:56,rel:{adou:55,xiaoman:50,suqing:48,wang:50,mom:58,dad:55},
         flags:{},log:[],note:null,attn:0,vow:null,vowDay:-1,done:false,undone:null,logOpen:false};
const KEY=['A','B','C','D','E'];
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const pickRand=a=>a[Math.floor(Math.random()*a.length)];
/* 注意：好感可能正好是 0，0 在 JS 里是假值 —— 必须用 ?? 而不是 ||，
   否则好感掉到 0 后，下一个碰到它的选项会把它错误地重置回 50。 */
const gv=k=>(S.rel[k]??50);
const relAvg=()=>Math.round(REL_KEYS.reduce((s,n)=>s+gv(n),0)/REL_KEYS.length);
function hearts(v){const n=v>=82?5:v>=66?4:v>=50?3:v>=34?2:v>=18?1:0;return '♥'.repeat(n)+'♡'.repeat(5-n);}

/* 手绘感进度条 */
function bar(v,color){
  const w=Math.max(0,Math.min(100,v)), half=(w/2).toFixed(1);
  return `<svg viewBox="0 0 100 12" preserveAspectRatio="none">
    <path d="M1 6 q24 -3.5 49 0 t49 0" fill="none" stroke="rgba(58,56,48,.3)" stroke-width="1.3" stroke-linecap="round"/>
    <path d="M1 6 q${(w*0.25).toFixed(1)} -3.2 ${half} 0 t${half} 0" fill="none"
      stroke="${color}" stroke-width="5" stroke-linecap="round"/>
  </svg>`;
}

/* 阻尼：越接近上限越难涨（60→0.87，80→0.50，90→0.37）；减分永远全额生效。
   末端压得更狠，保证没有"全选学习"就能顶到 100 的路线。 */
function dim(cur){return .20+.80*(94-cur)/78;}
function applyEff(eff){
  const b={score:S.score,mood:S.mood,rel:{...S.rel}};
  if(eff.score>0){
    let g=Math.max(1,Math.round(eff.score*dim(S.score)));
    if(S.score>=88) g=Math.min(g,eff.score>=8?2:1);   /* 88 分以上几乎不再涨 */
    S.score=clamp(S.score+g,0,100);
  }
  if(eff.score<0) S.score=clamp(S.score+eff.score,0,100);
  if(eff.mood>0)  S.mood =clamp(S.mood +Math.max(1,Math.round(eff.mood*dim(S.mood)/1.7)),0,100);
  if(eff.mood<0)  S.mood =clamp(S.mood +eff.mood,0,100);
  if(eff.rel) for(const k in eff.rel) S.rel[k]=clamp((S.rel[k]??50)+eff.rel[k],0,100);
  if(eff.attn) S.attn+=eff.attn;
  const out={score:S.score-b.score,mood:S.mood-b.mood,rel:{}};
  for(const k in S.rel) if(S.rel[k]!==b[k]) out.rel[k]=S.rel[k]-b[k];
  return out;
}
const curScene=()=>DAYS[S.day].scenes[Math.min(S.i,DAYS[S.day].scenes.length-1)];
const qno=()=>`第 ${S.i+1} 题 / 共 ${DAYS[S.day].scenes.length} 题`;

/* ---------- 渲染 ---------- */
function renderHead(){
  const d=DAYS[S.day];
  return `<div class="head">
    <div class="h-title">${d.title}</div>
    <div class="h-sub">初二(3)班 · ${d.sub}</div>
    <div class="h-row">
      <div class="daystamp">${DAYS.slice(0,S.day+1).map(x=>x.title).join(' · ')}</div>
      <div class="wk">${qno()}</div>
    </div>
  </div>
  <div class="stats">
    ${stat('分数',S.score,'var(--blue)','从 60 出发')}
    ${stat('心情',S.mood,'var(--gold)','低了会学不进')}
    ${stat('人际关系',relAvg(),'var(--green)','学校里这四个人')}
  </div>
  <div class="friends">${REL_KEYS.map(k=>`
    <div class="fr">
      <span class="av">${faceHTML(CHARS[k].face,28)}</span>
      <span class="nm">${CHARS[k].n}</span>
      <span class="ht" style="color:${S.rel[k]>=66?'#D33F2E':S.rel[k]>=42?'#C08A18':'#6B675C'}">${hearts(S.rel[k])}</span>
    </div>`).join('')}</div>`;
}
function stat(label,v,color,hint){
  return `<div class="stat">
    <div class="lab">${label}<em>${v}</em></div>
    <div class="bar">${bar(v,color)}</div>
    <div class="hint">${hint}</div>
  </div>`;
}
function logHTML(){
  if(!S.log.length) return '';
  /* 记住日志框的展开状态：重绘时如果无脑回到收起，页面高度突变会带着视口跳一下 */
  return `<div class="logbox">
    <div class="log-h" onclick="togLog()">✎ 我的草稿记录 <span style="margin-left:auto" id="lgA">${S.logOpen?'▴':'▾'}</span></div>
    <div class="log-b${S.logOpen?' on':''}" id="logB">${S.log.slice().reverse().map(l=>
      `<div class="lg"><span class="tm">${l.tm}</span>${l.tx}</div>`).join('')}</div>
  </div>`;
}
function togLog(){
  const b=$('logB'); if(!b) return;
  b.classList.toggle('on');
  S.logOpen=b.classList.contains('on');
  $('lgA').textContent=S.logOpen?'▴':'▾';
}

function render(){
  const sc=curScene();
  const sayHTML=sc.say?`<div class="say">
      <div class="av">${faceHTML(Object.assign({},CHARS[sc.say.who].face,{expr:sc.say.expr||'calm',pose:sc.say.pose||CHARS[sc.say.who].face.pose}),40)}</div>
      <div><div class="who">${CHARS[sc.say.who].n}</div>
      <div class="bubble"><div class="txt">${sc.say.txt}</div></div></div></div>`:'';
  const vowHTML=(sc.vowNote&&S.vow&&S.vowDay<S.day)
    ? `<div class="vow"><div class="vh">你昨晚对自己说的话</div>
       <div class="vt">「${S.vow.t}」<span class="badge">${S.vow.tag}</span></div></div>`:'';
  const noteHTML=S.note?`<div class="sticky${S.note.vio?' vio':''}">${S.note.t}</div>`:'';

  $('app').innerHTML=renderHead()+`
    <div class="q">
      <div class="q-no">${qno()}</div>
      <div class="q-head">
        <span class="q-time">${sc.t}</span>
        <span class="q-place">${sc.place}</span>
        <span class="q-where">${sc.where}</span>
      </div>
      <div class="q-text">${sc.text}</div>
      ${sayHTML}${vowHTML}${noteHTML}
      <div class="ans">${sc.opts.map((o,i)=>`
        <button class="opt" data-i="${i}">
          <span class="k">${KEY[i]}</span>
          <span class="tx">${o.t}<small>${o.s}</small></span>
          <span class="mk">✓</span>
        </button>`).join('')}</div>
      <div id="markSlot"></div>
    </div>
    ${logHTML()}`;
  document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(+b.dataset.i));
}

/* ---------- 答题 + 红笔批改 ---------- */
function answer(i){
  if(S.done) return;
  const sc=curScene(), o=sc.opts[i];
  if(!o) return;

  const d=applyEff(o.eff||{});
  /* flag 写在选项上或 eff 里都认 */
  const fl=o.flag||(o.eff&&o.eff.flag);
  if(fl) S.flags[fl]=(S.flags[fl]||0)+1;
  pushLog(sc.t,o.log);

  // 作弊被逮（概率随 attn 上升）
  if(o.gate==='cheat'&&Math.random()<.30+S.attn*.10){
    S.note={vio:true,t:'<b>！！被逮到了：</b>'+pickRand([
      '你抄到一半，身后有人咳了一声——班主任站在你背后，站了很久。',
      '小纸片被风吹到了地上，正好落在巡查的教导主任脚边。',
      '你抬头的时候，监考老师正看着你。你们对视了整整两秒。',
      '走廊尽头传来一句"你们几个，过来一下"。'
    ])+' 小抄被没收了，名字也记住了。'};
    const pd=applyEff({mood:-9,rel:{wang:-16}});
    d.mood+=pd.mood; d.rel.wang=(d.rel.wang||0)+pd.rel.wang;
    pushLog(sc.t,'<span class="r">（被逮到：王老师 -16，心情 -9）</span>');
  } else S.note=null;

  // 随机小事
  if(Math.random()<.3&&!S.note){
    const n=pickRand(NOTES);
    const nd=applyEff(n.s||{});
    d.score+=nd.score; d.mood+=nd.mood;
    for(const k in nd.rel) d.rel[k]=(d.rel[k]||0)+nd.rel[k];
    S.note={t:n.t};
    pushLog(sc.t,n.log);
  }

  // 睡前承诺
  if(o.vow){S.vow=o.vow;S.vowDay=S.day;S.flags.vowed=(S.flags.vowed||0)+1;}

  showMark(o.red,d);
  document.querySelectorAll('.opt').forEach((b,bi)=>{
    b.classList.add('lock');
    if(bi===i){b.classList.add('picked');}
    else{
      b.classList.add('wrong');
      b.insertAdjacentHTML('beforeend',
        '<span class="cross"><svg viewBox="0 0 200 26" preserveAspectRatio="none">'+
        '<path d="M4 9 q40 11 92 5 t100 -3"/></svg></span>');
    }
  });
  /* 刻意不滚动：任何自动滚动都会让"点一下动一下"，比不滚更烦。
     批改块紧跟在选项下面，用户的眼睛本来就在那儿。 */
}
function pushLog(tm,tx){S.log.push({tm,tx});}

function showMark(red,d){
  const items=[];
  if(d.score) items.push(`<span class="${d.score>0?'d-up':'d-dn'}">分数 ${d.score>0?'+':''}${d.score}</span>`);
  if(d.mood)  items.push(`<span class="${d.mood>0?'d-up':'d-dn'}">心情 ${d.mood>0?'+':''}${d.mood}</span>`);
  for(const k in d.rel){
    if(!d.rel[k]) continue;
    const who=CHARS[k]?CHARS[k].n:k;
    items.push(`<span class="${d.rel[k]>0?'d-up':'d-dn'}">${who} ${d.rel[k]>0?'+':''}${d.rel[k]}</span>`);
  }
  if(!items.length) items.push('<span class="d-0">这一下什么也没变</span>');
  $('markSlot').innerHTML=`<div class="mark">
    <div class="stamp">批 改</div>
    <div class="cmt">${red}</div>
    <div class="dlt">${items.join('')}</div>
    <button class="btn-next" id="btnNext" onclick="nextQ()">下一题 ↓</button>
  </div>`;
}

/* ---------- 下一题 ---------- */
function nextQ(){
  S.note=null;
  S.i++;
  const newQ=true;
  if(S.i>=DAYS[S.day].scenes.length){
    S.day++; S.i=0;
    if(S.day>=DAYS.length){
      S.done=true;
      // 最后一个承诺没来得及兑现 —— 如实写进成绩单
      if(S.vow) S.undone=S.vow;
      return report();
    }
    // 兑现昨晚的承诺
    if(S.vow&&S.vow.bonus){
      applyEff(S.vow.bonus);
      S.note={t:'<b>你说到做到了：</b>「'+S.vow.t+'」。今天早上出门的时候，你真的照做了。'};
      pushLog('清晨','兑现了昨晚对自己的承诺：'+S.vow.t);
    }
  }
  keepQPos(render);
}

/* 记住 / 还原「题目块在屏幕上的位置」。
   换题时旧的批改块消失、页面变短，浏览器会把滚动位置夹回去造成跳动。
   只要让题目块回到原来的屏幕位置，视觉上就是原地换内容，完全不晃。
   注意：必须在动画播完之后再量位置，否则量到动画中途的错位，补滚之后动画结束内容又挪回去。 */
function keepQPos(fn){
  const q=document.querySelector('.q');
  const before=q?q.getBoundingClientRect().top:0;
  const done=()=>{
    const q2=document.querySelector('.q');
    if(!q2) return;
    const delta=q2.getBoundingClientRect().top-before;
    if(Math.abs(delta)>1&&window.pageYOffset+delta>0) window.scrollTo(0,window.pageYOffset+delta);
  };
  fn();
  /* 等一帧让布局稳定、再等动画播完，然后才补滚 */
  if(typeof requestAnimationFrame==='function'){
    requestAnimationFrame(()=>requestAnimationFrame(done));
  } else setTimeout(done,40);
}

/* ---------- 结算成绩单 ---------- */
function rankOf(){
  const sc=S.score;
  if(sc>=88) return '年级前 20 名';
  if(sc>=80) return '年级前 80 名';
  if(sc>=72) return '年级前 200 名';
  if(sc>=64) return '年级前 400 名';
  if(sc>=55) return '年级中下游';
  return '班级后 1/3';
}
function report(){
  const s={score:S.score,mood:S.mood,rel:{...S.rel,avg:relAvg()},flags:S.flags};
  const e=ENDINGS.find(x=>x.test(s))||ENDINGS[ENDINGS.length-1];
  const bars=[['分数',s.score,'var(--blue)'],['心情',s.mood,'var(--gold)'],['人际关系',s.rel.avg,'var(--green)']];

  const ach=[];
  const F=[['cheat','抄小抄'],['game','打游戏'],['late','熬夜'],['absent','缺考'],
           ['lie','撒谎'],['hwcopy','抄作业'],['flee','溜值日'],['sport','认真跑步'],
           ['confess','跟老师说实话'],['regretCheat','睡前想起小抄'],['vowed','对自己许过诺']];
  F.forEach(([k,n])=>{if(s.flags[k])ach.push(n+' ×'+s.flags[k]);});

  const people=REL_KEYS.concat(['mom','dad']).map(k=>{
    const v=gv(k), nm=CHARS[k].n;
    const w=v>=78?'亲近':v>=58?'还行':v>=40?'一般':'疏远';
    return `${nm}：${w}（${hearts(v)}）`;
  });

  const ov=document.createElement('div');
  ov.className='over';
  ov.innerHTML=`<div class="report">
    <div class="grade-big">${e.grade}</div>
    <div class="rp-k">初 二(3) 班 · 期 中 成 绩 单</div>
    <div class="rp-t">${e.t}</div>
    <div class="rp-line">${e.red}</div>

    <div class="rp-card">
      <h4>▎三个数</h4>
      <div class="rp-bars">${bars.map(b=>`
        <div class="rpb"><span class="nm">${b[0]}</span>
        <span class="bar">${bar(b[1],b[2])}</span><span class="vl">${b[1]}</span></div>`).join('')}</div>
      <div class="rank">${rankOf()}<br>${people.join('　')}</div>
    </div>

    <div class="rp-card">
      <h4>▎这三天你干了什么</h4>
      <p>${ach.length?ach.join('、')+'。':'这三天很干净，什么出格的事都没干。'}</p>
    </div>

    ${S.undone?`<div class="rp-card">
      <h4>▎你留给下周一的话</h4>
      <p>「${S.undone.t}」<br><span style="color:var(--pen-2);font-size:15px">这句话还没来得及兑现。三天到这里就结束了——下周一早上，你打算照做吗？</span></p>
    </div>`:''}

    <div class="rp-card">
      <h4>▎老师想对你说</h4>
      <p>${e.body}</p>
    </div>

    <div class="acts">
      <button class="big" onclick="location.reload()">再玩一次（换个身份）</button>
      <button class="big alt2" onclick="showLog()">看看我这三天写了什么</button>
    </div>
  </div>`;
  document.body.appendChild(ov);
  ov.querySelector('.alt2').onclick=showLog;
}
function showLog(){
  const old=document.querySelector('.over'); if(old) old.remove();
  const ov=document.createElement('div');
  ov.className='over';
  ov.innerHTML=`<div class="report">
    <div class="rp-k">我 的 草 稿 记 录</div>
    <div class="rp-t">这 三 天</div>
    <div class="rp-card" style="margin-top:14px"><p>${S.log.map(l=>
      `<span class="lg"><span class="tm">${l.tm}</span>${l.tx}</span>`).join('<br>')}</p></div>
    <div class="acts"><button class="big alt" onclick="document.querySelector('.over').remove()">关上</button></div>
  </div>`;
  document.body.appendChild(ov);
}

/* ==========================================================================
   8. 开场
   ========================================================================== */
function intro(){
  $('app').innerHTML=`<div class="intro">
    <h2>草稿纸人生</h2>
    <div class="ct">初二(3)班 · 46 个人里的一个 · 一张草稿纸上的三天</div>
    <div class="paper-note">
      <div class="r"><i>①</i><span>这三天，你要在<b>学校</b>和<b>家</b>之间来回。每天八九件事：早读、上课、课间、午饭、值日、晚饭、睡前……</span></div>
      <div class="r"><i>②</i><span>每件事都是一道<b>题</b>，你在草稿纸上选一个答案。选完就<b>不能改了</b>——别的选项会被红笔划掉。</span></div>
      <div class="r"><i>③</i><span>会抄小抄、会打两小时游戏、会在老师眼皮底下装认真。<b>选哪个都行，后果都不一样。</b></span></div>
      <div class="r"><i>④</i><span>只有三个数：<b>分数</b>（从 60 出发）、<b>心情</b>、<b>人际关系</b>。分数最高的人不一定是最好的结局。</span></div>
      <div class="r"><i>⑤</i><span>最后你会拿到一张成绩单。上面有红笔写的评语，和一个你想不到的名字。</span></div>
    </div>
    <p style="font-size:17px;margin:6px 0 10px">先定个身份 —— 你是初二(3)班的哪一个？</p>
    <div class="ans" style="border-style:solid">${STARTS.map((s,i)=>`
      <button class="opt" data-i="${i}">
        <span class="k">${s.k}</span>
        <span class="tx">${s.t}<small>${s.s} · 初始分数 ${s.score}</small></span>
        <span class="mk"></span>
      </button>`).join('')}</div>
    <p class="tip">点一个开始 · 手机和电脑都能玩 · 建议用耳机（没有声音）</p>
  </div>`;
  document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
    const st=STARTS[+b.dataset.i];
    S.score=st.score;S.mood=st.mood;S.rel=Object.assign(S.rel,st.rel);
    pushLog('开始','我是'+st.t+'，带着 <b>'+S.score+'</b> 分走进初二(3)班。');
    keepQPos(render);
  });
}
intro();
</script>
