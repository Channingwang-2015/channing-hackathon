<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>今天这一天 · 初二人生模拟器</title>
<style>
  :root{
    --paper:#F0E4CE; --paper2:#FCF6EA; --ink:#1C1814; --ink2:#463C32; --soft:#8C7F6C;
    --red:#D23F28; --blue:#2F5D8C; --gold:#DDA02B; --green:#4B8A55; --purple:#7A5CA6;
    --line:#1C1814;
    --hudH:104px;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{background:var(--paper)}
  body{
    background:var(--paper);
    background-image:radial-gradient(rgba(28,24,20,.06) 1px, transparent 1px);
    background-size:5px 5px;
    color:var(--ink);min-height:100vh;
    font-family:"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  button{font-family:inherit}

  /* ====== 固定 HUD（状态条永远在最上，不被任何东西盖住） ====== */
  .hud{
    position:fixed;top:0;left:0;right:0;z-index:100;touch-action:manipulation;
    background:var(--ink);color:var(--paper2);
    box-shadow:0 3px 0 rgba(0,0,0,.25), 0 6px 22px rgba(28,24,20,.22);
  }
  .hud-row1{
    display:flex;align-items:center;gap:10px;
    padding:8px 14px 6px;
  }
  .hb-title{font-size:14px;font-weight:900;letter-spacing:2.5px;white-space:nowrap}
  .hb-title span{display:block;font-size:9.5px;font-weight:400;letter-spacing:.5px;opacity:.55;margin-top:1px}
  .hb-progress{flex:1;display:flex;align-items:center;gap:3px;min-width:0}
  .pb{height:5px;flex:1;max-width:16px;background:rgba(252,246,234,.2);border-radius:3px;transition:background .3s}
  .pb.done{background:var(--gold)}
  .pb.now{background:#fff;box-shadow:0 0 0 2px rgba(221,160,43,.5)}
  .hb-clock{
    background:var(--gold);color:var(--ink);font-weight:900;font-size:13px;
    padding:3px 11px;border-radius:14px;letter-spacing:1px;flex:none;
  }
  .hb-btn{
    background:transparent;border:1px solid rgba(252,246,234,.32);color:var(--paper2);
    font-size:11px;padding:4px 9px;border-radius:13px;cursor:pointer;flex:none;
    min-width:34px;min-height:26px;line-height:1;
  }
  .hb-menu{font-size:17px;font-weight:900;letter-spacing:0;padding:2px 8px 5px;min-width:36px;min-height:30px}
  .hb-menu:hover{background:rgba(252,246,234,.2)}
  .hb-btn:hover{background:rgba(252,246,234,.14)}

  .hud-row2{
    display:grid;grid-template-columns:repeat(5,1fr);gap:1px;
    background:rgba(252,246,234,.16);
    border-top:1px solid rgba(252,246,234,.16);
  }
  .hstat{
    background:var(--ink);border:none;cursor:pointer;text-align:left;
    padding:6px 8px 7px;color:var(--paper2);position:relative;overflow:hidden;
    transition:background .15s;
  }
  .hstat:hover{background:#2A231C}
  .hstat.flash{animation:hflash .85s ease}
  @keyframes hflash{0%{background:rgba(221,160,43,.5)}100%{background:var(--ink)}}
  .hs-top{display:flex;align-items:baseline;gap:2px;font-size:10px;opacity:.8;margin-bottom:3px;white-space:nowrap}
  .hs-top .nm{flex:0 0 auto;font-weight:700}
  .hs-top .ico{font-size:11px;opacity:1}
  .hs-top .vl{margin-left:auto;font-size:13px;font-weight:900;opacity:1;letter-spacing:-.3px;padding-left:2px}
  .hs-bar{height:5px;background:rgba(252,246,234,.17);border-radius:3px;overflow:hidden}
  .hs-bar>i{display:block;height:100%;border-radius:3px;transition:width .6s cubic-bezier(.3,1.2,.4,1)}
  .hs-delta{
    position:absolute;right:6px;top:20px;font-size:11px;font-weight:900;
    animation:rise 1.3s ease-out forwards;pointer-events:none;
  }
  @keyframes rise{0%{opacity:0;transform:translateY(6px)}25%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-9px)}}

  /* ====== 主体：padding-top 精确等于 HUD 高度 ====== */
  .stage{padding:calc(var(--hudH) + 14px) 12px 46px;max-width:900px;margin:0 auto}
  .stage.on{padding-bottom:70px}

  /* ====== 漫画分镜 ====== */
  .panel{
    background:var(--paper2);border:3px solid var(--line);border-radius:5px;overflow:hidden;
    box-shadow:5px 5px 0 rgba(28,24,20,.15);
  }
  .frame{
    position:relative;width:100%;height:280px;overflow:hidden;
    border-bottom:3px solid var(--line);background:#DED2BB;cursor:pointer;
  }
  .frame svg.bg{position:absolute;inset:0;width:100%;height:100%;display:block}
  .frame-idx{
    position:absolute;top:0;left:0;z-index:5;background:var(--ink);color:var(--paper2);
    font-size:11px;font-weight:800;padding:4px 10px;letter-spacing:1.5px;border-radius:0 0 5px 0;
  }
  .frame-place{
    position:absolute;bottom:0;left:0;z-index:5;background:rgba(28,24,20,.82);color:var(--paper2);
    font-size:10.5px;padding:3px 10px;letter-spacing:1px;border-radius:0 5px 0 0;
  }
  .frame-cast{display:none;position:absolute;top:34px;left:8px;z-index:6;display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-start;max-width:70%}
  .ctag{
    font-size:10px;font-weight:700;padding:2px 7px;border-radius:10px;
    border:1.5px solid var(--line);background:var(--paper2);color:var(--ink);
  }
  .ctag.pos{background:var(--green);color:#fff}
  .ctag.neg{background:var(--red);color:#fff}
  .ctag.self{background:var(--ink);color:var(--paper2)}

  /* 分镜里的人物立绘 */
  .cast-stage{position:absolute;left:0;right:0;bottom:0;z-index:3;height:96%;pointer-events:none;
    display:flex;align-items:flex-end;justify-content:center;gap:3%;padding:0 4% 20px}
  .fig{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;
    animation:figin .42s cubic-bezier(.2,1.2,.4,1) both}
  @keyframes figin{from{opacity:0;transform:translateY(16px) scale(.96)}to{opacity:1;transform:none}}
  .fig svg{display:block;width:auto;height:100%;max-height:100%;
    filter:drop-shadow(3px 3px 0 rgba(28,24,20,.16))}
  .fig .shadow{
    width:calc(100% - 12px);height:7px;border-radius:50%;
    background:radial-gradient(ellipse,rgba(28,24,20,.26),transparent 70%);margin-top:-4px;
  }
  .fig .nm{
    order:9;position:absolute;bottom:4px;left:50%;transform:translateX(-50%);
    font-size:9.5px;font-weight:800;background:var(--ink);color:var(--paper2);
    padding:1.5px 8px;border-radius:9px;white-space:nowrap;letter-spacing:.5px;
    box-shadow:1.5px 1.5px 0 rgba(28,24,20,.25);z-index:6;
  }
  .fig .nm.neg{background:var(--red)}
  .fig .nm.pos{background:var(--green)}
  .fig.me{order:-1}
  .fig .bub{
    position:absolute;top:-14px;right:-8px;z-index:4;
    background:#fff;border:2.5px solid var(--line);border-radius:50%;
    width:34px;height:34px;display:flex;align-items:center;justify-content:center;
    font-size:17px;box-shadow:2px 2px 0 rgba(28,24,20,.18);
    animation:bubble 1.8s ease-in-out infinite;
  }
  @keyframes bubble{50%{transform:translateY(-4px)}}
  .fig .figbody{flex:1;width:100%;display:flex;align-items:flex-end;justify-content:center;min-height:0}
  .fig .figbody>svg{height:100%;width:auto}
  .fig.big{width:20%}
  .fig.mid{width:15%}
  .fig.sm{width:11.5%}
  .fig.xs{width:9%}
  .frame::after{
    content:'';position:absolute;inset:0;pointer-events:none;
    background:repeating-linear-gradient(45deg,rgba(0,0,0,.022) 0 2px,transparent 2px 5px);
  }

  /* 旁白 */
  .narr{
    margin:13px 14px 0;padding:11px 14px;
    border-left:4px solid var(--gold);background:#FFF8E9;
    font-size:14.5px;line-height:1.9;color:var(--ink2);
  }
  .narr em{font-style:normal;color:var(--red);font-weight:800}
  .narr:empty{display:none}

  /* 对话气泡 */
  .dlg{margin:14px 14px 0}
  .dlg-head{
    display:inline-flex;align-items:center;gap:6px;background:var(--ink);color:var(--paper2);
    font-size:12.5px;font-weight:800;padding:4px 13px 4px 9px;border-radius:4px 4px 0 0;letter-spacing:1px;
  }
  .dlg-head .face{width:22px;height:22px;border-radius:50%;overflow:hidden;display:block;flex:none;background:#fff;border:1.5px solid var(--line)}
  .dlg-body{
    background:#fff;border:3px solid var(--line);border-top:none;border-radius:0 4px 4px 4px;
    padding:13px 16px;font-size:16.5px;line-height:1.85;min-height:62px;white-space:pre-wrap;
    box-shadow:3px 3px 0 rgba(28,24,20,.1);letter-spacing:.3px;
  }
  .dlg-body:empty,.dlg[style*="display: none"]{display:none}
  .caret{display:inline-block;width:9px;height:17px;background:var(--ink);vertical-align:-3px;animation:blink .65s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}

  /* 继续按钮 */
  .continue{
    display:none;margin:10px 14px 0;width:calc(100% - 28px);
    background:var(--ink);color:var(--paper2);border:none;border-radius:5px;
    padding:10px;font-size:13.5px;font-weight:800;letter-spacing:2px;cursor:pointer;
    box-shadow:3px 3px 0 rgba(28,24,20,.2);
  }
  .continue.show{display:block}
  .continue:hover{background:#2E251D}

  /* 选择 */
  .choices{margin:13px 14px 14px;display:flex;flex-direction:column;gap:9px;opacity:0;transform:translateY(8px);transition:opacity .3s,transform .3s;pointer-events:none}
  .choices.on{opacity:1;transform:none;pointer-events:auto}
  .choice{
    position:relative;text-align:left;width:100%;
    background:var(--paper2);border:2.5px solid var(--line);border-radius:5px;
    padding:11px 14px 11px 44px;cursor:pointer;font-size:15.5px;color:var(--ink);
    box-shadow:3px 3px 0 rgba(28,24,20,.13);transition:transform .1s,box-shadow .1s,background .15s;
  }
  .choice::before{
    content:attr(data-k);position:absolute;left:11px;top:50%;transform:translateY(-50%);
    width:22px;height:22px;border:2px solid var(--line);border-radius:50%;background:var(--gold);
    display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:900;
  }
  .choice b{display:block;font-weight:700;line-height:1.5}
  .choice small{display:block;font-size:12px;color:var(--soft);margin-top:3px;font-style:italic;font-weight:400}
  .choice:hover{transform:translate(-1px,-2px);box-shadow:5px 5px 0 rgba(28,24,20,.2);background:#fff}
  .choice:active{transform:translate(2px,2px);box-shadow:1px 1px 0 rgba(28,24,20,.15)}

  /* 变化提示卡 */
  .deltawrap{min-height:0}
  .deltacard{
    margin:12px 14px 0;border:2.5px solid var(--line);border-radius:5px;background:#FFF8E9;
    padding:11px 14px;opacity:0;transform:translateY(-6px);transition:.4s;
  }
  .deltacard.on{opacity:1;transform:none}
  .deltacard .dh{font-size:10px;letter-spacing:2px;color:var(--soft);font-weight:800;margin-bottom:5px}
  .deltacard .dp{font-size:14.5px;font-weight:700;margin-bottom:7px;line-height:1.5}
  .deltacard .dd{display:flex;flex-wrap:wrap;gap:5px}
  .deltacard .dl{font-size:11.5px;font-weight:800;padding:2px 9px;border-radius:11px;border:1.5px solid var(--line);background:#fff}
  .deltacard .dl.up{color:var(--green)} .deltacard .dl.dn{color:var(--red)}

  /* 关系墙 */
  .wall{margin:14px 14px 0;border:2.5px solid var(--line);border-radius:5px;background:#fff;padding:11px 13px}
  .wall-h{font-size:11px;font-weight:800;letter-spacing:2.5px;color:var(--soft);margin-bottom:9px;display:flex;align-items:center;gap:7px}
  .wall-h::after{content:'';flex:1;height:1.5px;background:repeating-linear-gradient(90deg,var(--line) 0 5px,transparent 5px 9px);opacity:.3}
  .wall-list{display:flex;flex-wrap:wrap;gap:6px}
  .wnone{font-size:12px;color:var(--soft)}
  .wrow{
    display:flex;align-items:center;gap:6px;padding:3px 9px 3px 3px;
    border:1.5px solid var(--line);border-radius:18px;background:var(--paper);
    font-size:12px;font-weight:700;cursor:pointer;
  }
  .wrow:hover{background:#fff}
  .wrow .av{width:24px;height:24px;border-radius:50%;overflow:hidden;flex:none;border:1.5px solid var(--line);background:#fff;display:block}
  .wrow .meter{width:34px;height:5px;background:#E3D8C2;border-radius:3px;overflow:hidden;display:block}
  .wrow .meter>i{display:block;height:100%;transition:width .5s}
  .wrow.good .meter>i{background:var(--green)} .wrow.bad .meter>i{background:var(--red)}
  .wrow .lv{font-size:10px;color:var(--soft);font-weight:700}
  .wrow .wsign{font-size:10px;font-weight:900;color:var(--soft);min-width:20px;text-align:right}
  .wrow.good .wsign{color:var(--green)} .wrow.bad .wsign{color:var(--red)}

  /* 日志 */
  .journal{margin:14px 14px 0;border:2.5px solid var(--line);border-radius:5px;background:#fff;overflow:hidden}
  .journal-h{
    background:var(--line);color:var(--paper2);font-size:11px;font-weight:800;letter-spacing:2px;
    padding:7px 13px;display:flex;align-items:center;gap:7px;cursor:pointer;
  }
  .journal-body{max-height:250px;overflow-y:auto;padding:10px 13px}
  .journal-body::-webkit-scrollbar{width:6px}
  .journal-body::-webkit-scrollbar-thumb{background:#C9BCA2;border-radius:3px}
  .jl{display:flex;gap:9px;padding:4px 0;border-bottom:1px dashed #E7DCC8}
  .jl:last-child{border-bottom:none}
  .jl .tm{color:var(--soft);font-size:11px;flex:none;width:38px;padding-top:3px;font-weight:800}
  .jl .tx{flex:1;font-size:13.5px;line-height:1.85;color:var(--ink2)}
  .jl .tx b.pos{color:var(--green)} .jl .tx b.neg{color:var(--red)}
  .jtrace{display:flex;flex-direction:column;gap:6px}
  .jt{display:flex;gap:9px;font-size:13px;line-height:1.6;align-items:flex-start}
  .jt-t{color:var(--soft);font-size:11px;font-weight:800;flex:none;width:38px;padding-top:2px}
  .jt-p{flex:1}

  /* ====== 浮层 sheet ====== */
  .sheet{
    position:fixed;inset:0;z-index:200;background:var(--paper);
    background-image:radial-gradient(rgba(28,24,20,.06) 1px,transparent 1px);background-size:5px 5px;
    opacity:0;transition:opacity .28s;overflow-y:auto;-webkit-overflow-scrolling:touch;
  }
  .sheet.on{opacity:1}
  .sheet-scroll{max-width:600px;margin:0 auto;padding:34px 18px 60px}
  .sheet-stat .sheet-scroll,.sheet-rel .sheet-scroll{padding-top:26px}

  .intro-mark{
    width:70px;height:70px;margin:0 auto 14px;border:3px solid var(--line);border-radius:50%;
    display:flex;align-items:center;justify-content:center;font-size:32px;background:var(--gold);
  }
  .sc-kicker{text-align:center;font-size:10.5px;letter-spacing:4.5px;color:var(--soft);font-weight:800}
  .sc-title{text-align:center;font-size:32px;font-weight:900;letter-spacing:2px;margin-top:6px;line-height:1.3}
  .sc-title.sm{font-size:25px}
  .sc-sub{text-align:center;font-size:12px;color:var(--soft);margin-top:8px;letter-spacing:.5px}
  .sc-rule{width:64px;height:4px;background:var(--red);margin:15px auto 18px;border-radius:2px}
  .sc-card{
    background:var(--paper2);border:3px solid var(--line);border-radius:5px;padding:15px 17px;margin-bottom:12px;
    box-shadow:4px 4px 0 rgba(28,24,20,.13);
  }
  .sc-card h3{
    font-size:11px;letter-spacing:3px;color:var(--soft);margin-bottom:10px;font-weight:800;
    display:flex;align-items:center;gap:7px;
  }
  .sc-card h3::after{content:'';flex:1;height:1.5px;background:repeating-linear-gradient(90deg,var(--line) 0 5px,transparent 5px 9px);opacity:.28}
  .sc-card p{font-size:14.5px;line-height:1.95;color:var(--ink2)}
  .sc-card p b{color:var(--ink)}
  .sc-card p em{font-style:normal;color:var(--red);font-weight:800}
  .sc-card-dark{background:var(--ink);border-color:var(--ink);color:var(--paper2)}
  .sc-card-dark h3{color:#A2947F}
  .sc-card-dark h3::after{background:repeating-linear-gradient(90deg,#A2947F 0 5px,transparent 5px 9px)}
  .sc-card-dark p{color:#EFE6D8}
  .sc-card-dark p b{color:var(--gold)}
  .sc-card-dark .dim{color:#9C8F7B;font-size:13px}
  .sc-card-dark em{font-style:normal;color:var(--gold);font-weight:800}

  .stat-legend{display:flex;flex-direction:column;gap:8px}
  .sl{display:flex;align-items:center;gap:8px;font-size:13.5px}
  .sl-i{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;border:2px solid var(--line);flex:none}
  .sl b{min-width:34px}
  .sl span:last-child{color:var(--soft);font-size:12.5px}

  .btn-big{
    display:block;width:100%;border:3px solid var(--line);background:var(--red);color:#fff;
    font-size:17px;font-weight:800;padding:13px;border-radius:5px;cursor:pointer;
    letter-spacing:2px;box-shadow:4px 4px 0 rgba(28,24,20,.2);margin-top:6px;
  }
  .btn-big:hover{filter:brightness(1.07)}
  .btn-big.alt{background:var(--paper2);color:var(--ink);margin-top:12px}
  .btn-big.alt:hover{background:#fff}
  .fine{text-align:center;font-size:11px;color:var(--soft);margin-top:14px;line-height:1.9}

  .verdict{font-size:17px;line-height:1.95;color:var(--ink);font-weight:600}

  /* 结算条 */
  .ebars{display:flex;flex-direction:column;gap:8px}
  .ebar{
    display:flex;align-items:center;gap:9px;background:none;border:none;padding:3px 2px;cursor:pointer;text-align:left;width:100%;
  }
  .ebar:hover{background:#fff}
  .en{font-size:12.5px;font-weight:800;width:56px;flex:none}
  .etrack{flex:1;height:13px;background:#E3D8C2;border-radius:6px;overflow:hidden;position:relative;border:1.5px solid var(--line)}
  .etrack>i{display:block;height:100%;transition:width 1s cubic-bezier(.3,1.2,.4,1)}
  .ev{font-size:13px;font-weight:900;width:28px;text-align:right;flex:none}
  .ev.low{color:var(--red)}
  .tiny{font-size:11px;color:var(--soft);margin-top:9px;text-align:center}

  .resume{margin:-4px 0 14px;border:3px solid var(--line);border-radius:5px;background:#FFF8E9;padding:13px 15px;box-shadow:4px 4px 0 rgba(28,24,20,.13)}
  .rs-t{font-size:11px;font-weight:800;letter-spacing:2px;color:var(--soft);margin-bottom:5px}
  .rs-b{font-size:14.5px;font-weight:700;margin-bottom:11px}
  .btn-sm{display:block;width:100%;background:none;border:none;color:var(--soft);font-size:12px;margin-top:9px;cursor:pointer;text-decoration:underline;font-family:inherit}
  .btn-sm:hover{color:var(--red)}
  .opening{display:flex;align-items:center;gap:13px;padding:9px 0;border-bottom:1.5px dashed #E0D5C0}
  .opening:last-child{border-bottom:none}
  .op-n{font-size:34px;font-weight:900;line-height:1;min-width:52px;text-align:center;
    color:var(--soft);border:3px solid var(--line);border-radius:8px;padding:5px 6px;background:var(--paper)}
  .op-n.good{color:#fff;background:var(--green);border-color:var(--ink)}
  .op-n.bad{color:#fff;background:var(--red);border-color:var(--ink)}
  .op-l{font-size:14px;font-weight:700;line-height:1.5}
  .op-l span{font-size:12px;color:var(--soft);font-weight:400}
  .cos{display:flex;flex-direction:column}
  .co{display:flex;gap:11px;align-items:center;background:none;border:none;padding:9px 2px;border-bottom:1.5px dashed #E0D5C0;cursor:pointer;text-align:left;width:100%}
  .co:last-child{border-bottom:none}
  .co:hover{background:#fff}
  .co-av{width:46px;height:46px;border-radius:50%;overflow:hidden;flex:none;border:2px solid var(--line);background:#fff;display:block}
  .co-main{flex:1;min-width:0}
  .co-name{font-size:14.5px;font-weight:800;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .co-name em{font-style:normal;font-size:10px;padding:1px 7px;border-radius:9px;font-weight:800}
  .co-name em.g{background:var(--green);color:#fff}
  .co-name em.r{background:var(--red);color:#fff}
  .co-name em.y{background:var(--gold);color:#fff}
  .co-txt{font-size:12.5px;color:var(--soft);margin-top:2px}

  /* 属性说明 */
  .sdesc-top{text-align:center;color:#fff;padding:22px 0 20px;margin:-34px -18px 18px;border-bottom:3px solid var(--line)}
  .sdesc-ico{font-size:38px}

  .sdesc-name{font-size:15px;font-weight:800;letter-spacing:3px}

  /* 关系详情 */

  .rel-v{font-size:14px;font-weight:800}
  .rel-v span{display:block;font-size:12.5px;color:var(--soft);font-weight:400;margin-top:3px}
  .end-stamp{text-align:center;display:inline-block;background:var(--ink);color:var(--paper2);font-size:10px;font-weight:800;letter-spacing:3px;padding:4px 13px;border-radius:3px;margin-bottom:6px}

  @media(max-width:620px){
    .hud-row1{padding:7px 10px 5px;gap:7px}

<script>const SKIN=['#F6D9BE','#EFC49B','#DFA87B','#C98A5C','#F9E3CD'];
const HAIR=['#2B2119','#3E2B1C','#141210','#5A3A22','#8B5A2B'];
const CLOTH=['#D8452F','#2F5D8C','#4E8C57','#7B5EA7','#E0A32E','#5A6670','#C25B8E','#3E8C8C'];

function faceSVG(o){
  o=o||{};
  const skin=SKIN[o.skin||1], hair=HAIR[o.hair||0], cloth=CLOTH[(o.cloth!==undefined?o.cloth:0)%CLOTH.length];
  const style=o.style||'short';       // short / long / twin / buzz / curly / cap / hood
  const e=o.expr||'calm';             // calm smile grin sad angry shock evil tired
  let S='',id='p'+(Math.random()*1e6|0);

  // 表情：眼
  let eyes='';
  const eye=(x,y)=>{
    if(e==='sad')    return `<path d="M${x-4} ${y-2} q4 3 8 0" stroke="#1E1A16" stroke-width="2.2" fill="none" stroke-linecap="round"/>`;
    if(e==='shock')  return `<ellipse cx="${x}" cy="${y}" rx="3.4" ry="4.4" fill="#fff" stroke="#1E1A16" stroke-width="1.8"/><circle cx="${x}" cy="${y+1}" r="1.9" fill="#1E1A16"/>`;
    if(e==='evil'||e==='angry') return `<path d="M${x-4} ${y+2} l8 -4" stroke="#1E1A16" stroke-width="2.4" stroke-linecap="round"/>`;
    if(e==='tired')  return `<path d="M${x-4} ${y} h8" stroke="#1E1A16" stroke-width="2.2" stroke-linecap="round"/><path d="M${x-4} ${y-4.5} q4 -2 8 0" stroke="#1E1A16" stroke-width="1.5" fill="none"/>`;
    if(e==='grin')   return `<path d="M${x-4} ${y} q4 5 8 0" stroke="#1E1A16" stroke-width="2.2" fill="none" stroke-linecap="round"/>`;
    return `<ellipse cx="${x}" cy="${y}" rx="3.1" ry="3.9" fill="#fff" stroke="#1E1A16" stroke-width="1.8"/><circle cx="${x}" cy="${y+0.6}" r="1.8" fill="#1E1A16"/>`;
  };
  // 眉毛
  let brows='';
  const brow=(x,y,tilt)=>{
    const d=tilt<0?`M${x-5} ${y-2} l10 2`:`M${x-5} ${y+2} l10 -2`;
    return `<path d="${d}" stroke="#1E1A16" stroke-width="2" fill="none" stroke-linecap="round" opacity=".85"/>`;
  };
  eyes = eye(19,34)+eye(37,34);
  if(e==='angry') brows = brow(19,26,-1)+brow(37,26,-1);
  if(e==='evil')  brows = brow(19,26,-1)+brow(37,26,-1);
  if(e==='sad')   brows = brow(19,25,1)+brow(37,25,1);
  if(e==='shock') brows = brow(19,25,1)+brow(37,25,1);

  // 嘴
  let mouth='';
  if(e==='smile')  mouth=`<path d="M22 45 q6 5 12 0" stroke="#1E1A16" stroke-width="2.2" fill="none" stroke-linecap="round"/>`;
  if(e==='grin')   mouth=`<path d="M20 44 q8 9 16 0 z" fill="#7A3B33" stroke="#1E1A16" stroke-width="1.8" stroke-linejoin="round"/><path d="M23 44 h10" stroke="#1E1A16" stroke-width="1.4"/>`;
  if(e==='sad')    mouth=`<path d="M22 48 q6 -5 12 0" stroke="#1E1A16" stroke-width="2.2" fill="none" stroke-linecap="round"/>`;
  if(e==='angry')  mouth=`<path d="M21 48 q7 -4 14 0" stroke="#1E1A16" stroke-width="2.4" fill="none" stroke-linecap="round"/>`;
  if(e==='shock')  mouth=`<ellipse cx="28" cy="47" rx="3.6" ry="4.6" fill="#7A3B33" stroke="#1E1A16" stroke-width="1.7"/>`;
  if(e==='evil')   mouth=`<path d="M20 46 q8 7 16 0" stroke="#1E1A16" stroke-width="2.2" fill="none" stroke-linecap="round"/><path d="M24 46 l1.6 3 1.6 -3 1.6 3 1.6 -3" fill="#1E1A16"/>`;
  if(e==='tired')  mouth=`<path d="M23 47 h10" stroke="#1E1A16" stroke-width="2.2" stroke-linecap="round"/>`;

  // 头发
  let hairS='';
  if(style==='short'){
    hairS=`<path d="M13 33 q0 -19 15 -19 q15 0 15 19 q-4 -9 -15 -8 q-11 -1 -15 8 z" fill="${hair}"/>`;
  } else if(style==='buzz'){
    hairS=`<path d="M14 30 q1 -16 14 -16 q13 0 14 16 q-5 -7 -14 -6 q-9 -1 -14 6 z" fill="${hair}"/>`;
  } else if(style==='long'){
    hairS=`<path d="M12 36 q-1 -22 16 -22 q17 0 16 22 l-4 24 l-4 -6 l-1 -18 q-4 4 -11 3 q-7 1 -11 -3 l-1 18 l-4 6 z" fill="${hair}"/>`;
  } else if(style==='twin'){
    hairS=`<circle cx="8" cy="30" r="6" fill="${hair}"/><circle cx="48" cy="30" r="6" fill="${hair}"/>
           <path d="M13 33 q0 -19 15 -19 q15 0 15 19 q-4 -9 -15 -8 q-11 -1 -15 8 z" fill="${hair}"/>`;
  } else if(style==='curly'){
    hairS=`<circle cx="13" cy="20" r="7" fill="${hair}"/><circle cx="24" cy="13" r="8" fill="${hair}"/>
           <circle cx="38" cy="13" r="8" fill="${hair}"/><circle cx="49" cy="21" r="7" fill="${hair}"/>
           <path d="M13 32 q0 -16 15 -16 q15 0 15 16 q-4 -8 -15 -7 q-11 -1 -15 7 z" fill="${hair}"/>`;
  } else if(style==='cap'){
    hairS=`<path d="M13 33 q0 -19 15 -19 q15 0 15 19 q-4 -9 -15 -8 q-11 -1 -15 8 z" fill="${hair}"/>
           <path d="M11 26 q0 -16 17 -16 q17 0 17 15 l-34 1 z" fill="${cloth}"/><path d="M45 25 l7 4 l-7 1 z" fill="${cloth}"/>`;
  } else if(style==='hood'){
    hairS=`<path d="M12 34 q0 -20 16 -20 q16 0 16 20 q-4 -9 -16 -8 q-12 -1 -16 8 z" fill="${hair}"/>
           <path d="M8 40 q0 -26 20 -26 q20 0 20 26 l-4 -2 q0 -20 -16 -20 q-16 0 -16 20 z" fill="${cloth}"/>`;
  }
  if(style!=='cap'&&style!=='hood'){
    hairS=`<path d="M13 33 q0 -19 15 -19 q15 0 15 19 q-4 -9 -15 -8 q-11 -1 -15 8 z" fill="${hair}"/>` + hairS;
  }

  // 身体姿势
  const pose=o.pose||'stand';   // stand / point / arms / sit / back / half / shrug
  let body='';
  const torso=`<path d="M18 60 h20 q7 0 7 8 v16 h-34 v-16 q0 -8 7 -8 z" fill="${cloth}" stroke="#1E1A16" stroke-width="2.2"/>`;
  if(pose==='stand'||pose==='arms'){
    body = torso + `<path d="M18 66 q-7 8 -7 18" stroke="#1E1A16" stroke-width="2.4" fill="none" stroke-linecap="round"/>
                    <path d="M38 66 q7 8 7 18" stroke="#1E1A16" stroke-width="2.4" fill="none" stroke-linecap="round"/>
                    <path d="M18 66 q-6 9 -6 18 l6 1 z" fill="${skin}" stroke="#1E1A16" stroke-width="1.8"/>
                    <path d="M38 66 q6 9 6 18 l-6 1 z" fill="${skin}" stroke="#1E1A16" stroke-width="1.8"/>`;
    if(pose==='arms') body = torso + `<path d="M17 66 q-6 10 0 17" stroke="#1E1A16" stroke-width="2.4" fill="none" stroke-linecap="round"/><path d="M39 66 q6 10 0 17" stroke="#1E1A16" stroke-width="2.4" fill="none" stroke-linecap="round"/>`;
  } else if(pose==='point'){
    body = torso + `<path d="M39 68 q14 -4 17 -12" stroke="#1E1A16" stroke-width="2.4" fill="none" stroke-linecap="round"/>
                    <path d="M55 54 q4 -2 5 2 q-1 4 -6 4 z" fill="${skin}" stroke="#1E1A16" stroke-width="1.8"/>
                    <path d="M18 66 q-7 9 -7 19" stroke="#1E1A16" stroke-width="2.4" fill="none" stroke-linecap="round"/>
                    <path d="M18 66 q-6 9 -6 19 l6 1 z" fill="${skin}" stroke="#1E1A16" stroke-width="1.8"/>`;
  } else if(pose==='shrug'){
    body = torso + `<path d="M18 67 q-9 2 -8 10" stroke="#1E1A16" stroke-width="2.4" fill="none" stroke-linecap="round"/>
                    <path d="M38 67 q9 2 8 10" stroke="#1E1A16" stroke-width="2.4" fill="none" stroke-linecap="round"/>
                    <path d="M9 76 q-4 3 1 5" stroke="#1E1A16" stroke-width="2.2" fill="none" stroke-linecap="round"/>`;
  } else if(pose==='back'){
    body = `<path d="M18 60 h20 q7 0 7 8 v16 h-34 v-16 q0 -8 7 -8 z" fill="${cloth}" stroke="#1E1A16" stroke-width="2.2"/>
            <path d="M14 32 q0 -18 14 -18 q14 0 14 18 q-2 6-3 8 h-22 q-1 -2 -3 -8 z" fill="${hair}" stroke="#1E1A16" stroke-width="2"/>`;
  } else { // half 半身
    body = torso;
  }

  // 腮红 / 汗
  let extra='';
  if(e==='shock'||e==='evil') extra+=`<path d="M46 40 q3 3 0 5" stroke="#7FB7D8" stroke-width="2" fill="none" stroke-linecap="round"/>`;
  if(o.sweat) extra+=`<ellipse cx="45" cy="38" rx="3" ry="4.5" fill="#8FC7E8" stroke="#1E1A16" stroke-width="1.4"/>`;

  return `<svg viewBox="0 0 56 96" xmlns="http://www.w3.org/2000/svg">
    <g>${body}</g>
    <g>
      <rect x="10" y="14" width="36" height="42" rx="17" fill="${skin}" stroke="#1E1A16" stroke-width="2.2"/>
      ${hairS}
      ${eyes}${brows}${mouth}
      <ellipse cx="16" cy="42" rx="3.4" ry="2.2" fill="#E89A8A" opacity=".5"/>
      <ellipse cx="40" cy="42" rx="3.4" ry="2.2" fill="#E89A8A" opacity=".5"/>
      ${extra}
    </g></svg>`;
}

function faceHTML(o,px){
  const d=document.createElement('div');
  d.style.cssText='width:'+px+'px;height:'+px+'px;overflow:hidden';
  d.innerHTML=faceSVG(o);
  const s=d.firstChild; s.setAttribute('width',px); s.setAttribute('height',px);
  return d.innerHTML;
}



/* 把一组人物摆进分镜里 */
function castStage(cast, speaker, moodMap){
  const list = (cast && cast.length) ? cast : ['me'];
  const n = list.length;
  const size = n<=1 ? 'big' : (n===2 || n===3) ? 'mid' : 'sm';
  const bubbles = { dashuang:'😏', zhengkai:'😝', ahao:'😢', chenxiaoyu:'📖', laowang:'😠', mom:'📱', dad:'😔', laoli:'💰', headteacher:'📋', me:'' };
  let html = '<div class="cast-stage">';
  list.forEach((k, i) => {
    const c = CAST[k]; if(!c) return;
    const f = Object.assign({}, c.face);
    if(k === speaker && f.expr === 'calm') f.expr = 'smile';
    if(moodMap && moodMap[k]) Object.assign(f, moodMap[k]);
    const isMe = k === 'me';
    const nmCls = c.kind==='neg' ? 'neg' : (c.kind==='pos' ? 'pos' : '');
    const bub = (!isMe && bubbles[k]) ? '<span class="bub">'+bubbles[k]+'</span>' : '';
    const scale = isMe ? (n<=2 ? 1.18 : 1.07) : 1;
    html += '<div class="fig '+(isMe?'me ':'')+size+'" style="height:'+Math.round(96*scale)+'%;animation-delay:'+(i*0.09)+'s">'
      + bub
      + '<span class="nm '+nmCls+'">'+c.name+'</span>'
      + '<span class="figbody">'+faceSVG(f)+'</span>'
      + '<span class="shadow"></span></div>';
  });
  return html + '</div>';
}

const $ = id => document.getElementById(id);
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/\n/g,'<br>');

let G = null;

/* ===== HUD：动态生成 + 动态量高（这是状态条曾经被盖住的根因，这里彻底修掉） ===== */
function buildHUD(){
  $('hud-stats').innerHTML = STATS.map(s =>
    `<button class="hstat" id="stat-${s.k}" onclick="showStatDesc('${s.k}')" title="${s.n}">
      <div class="hs-top"><span class="ico">${s.i}</span><span>${s.n}</span><span class="vl" id="num-${s.k}">0</span></div>
      <div class="hs-bar"><i id="bar-${s.k}" style="width:0%;background:${s.c}"></i></div>
    </button>`).join('');
  measureHUD();
}
function measureHUD(){
  const h = $('hud').offsetHeight;
  document.documentElement.style.setProperty('--hudH', h + 'px');
}
window.addEventListener('resize', measureHUD);
window.addEventListener('orientationchange', () => setTimeout(measureHUD, 200));

function buildProgress(){
  $('hb-progress').innerHTML = SCENES.map((s, i) =>
    `<span class="pb ${i < G.i ? 'done' : (i === G.i ? 'now' : '')}"></span>`).join('');
}

function newGame(){
  G = {
    i: 0,
    stats: { study:50, mood:60, energy:90, conf:50, rep:50 },
    inf:  { dashuang:0, zhengkai:0, chenxiaoyu:0, laowang:0, ahao:0, mom:0, dad:0, headteacher:0, laoli:0 },
    log: [], done: [], beats: [], silent: [],
    phase: 'intro'
  };
  buildHUD();
  buildProgress();
  syncStats(true);
  renderWall();
  $('journal').style.display = 'none';
  $('jarrow').textContent = '▸';
  $('delta').innerHTML = '';
  $('choices').innerHTML = '';
  $('choices').classList.remove('on');
  $('stage').classList.remove('on');
  showIntro();
}

/* 面板浮层：开场 / 结算 / 属性说明 共用 */
function openSheet(html, cls){
  closeSheet();
  const s = document.createElement('div');
  s.className = 'sheet ' + (cls||'');
  s.id = 'theSheet';
  s.innerHTML = html;
  document.body.appendChild(s);
  requestAnimationFrame(() => s.classList.add('on'));
  window.scrollTo(0,0);
  return s;
}
function closeSheet(){
  const s = $('theSheet');
  if(s) s.remove();
}

/* ========== 小音效（Web Audio，不加载任何文件） ========== */
let AC = null;
function beep(kind){
  try{
    if(!AC) AC = new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state === 'suspended') AC.resume();
    const seq = {
      tap:   [[520,0,.06]],
      pick:  [[440,0,.05],[660,.06,.09]],
      good:  [[523,0,.07],[659,.07,.07],[784,.14,.13]],
      bad:   [[320,0,.09],[240,.09,.13]],
      end:   [[523,0,.1],[659,.1,.1],[784,.2,.1],[1046,.3,.24]]
    }[kind] || [[440,0,.06]];
    seq.forEach(([f,t,d])=>{
      const o = AC.createOscillator(), g = AC.createGain();
      o.type = kind==='bad' ? 'sawtooth' : 'triangle';
      o.frequency.value = f;
      g.gain.setValueAtTime(0, AC.currentTime+t);
      g.gain.linearRampToValueAtTime(0.055, AC.currentTime+t+0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, AC.currentTime+t+d);
      o.connect(g); g.connect(AC.destination);
      o.start(AC.currentTime+t); o.stop(AC.currentTime+t+d+0.02);
    });
  }catch(e){}
}

function render(){
  const sc = SCENES[G.i];

  const prevCast = document.querySelector('#frame .cast-stage'); if(prevCast) prevCast.remove();
  $('clock').textContent = sc.time;

  $('fplace').textContent = sc.place;

  $('frame').insertAdjacentHTML('beforeend', castStage(sc.cast, spk, sc.mood));
  buildProgress();

  $('casttag').innerHTML = '';

  $('narr').innerHTML = sc.narr ? sc.narr : '';

  $('dlg-name').textContent = sc.who || '';
  $('dlg-face').innerHTML = faceHTML(CAST[faceK].face, 22);

  $('dlg').style.display = hasD ? 'block' : 'none';

  $('delta').innerHTML = '';

  if(G.log.length) renderJournal();

  const full = (sc.line ? sc.line : '') + (sc.reply ? (sc.line ? '\n\n' : '') + sc.reply : '');

}

function typeText(full, done){
  if(typingTimer) clearInterval(typingTimer);
  const el = $('dlg-body');
  isTyping = true; ready = false;
  if(!full){ el.innerHTML = ''; isTyping = false; ready = true; done(); return; }
  el.textContent = '';
  const caret = document.createElement('span'); caret.className = 'caret';
  let k = 0;
  const total = full.length;
  typingTimer = setInterval(() => {
    k += Math.max(1, Math.round(total/70));
    el.textContent = full.slice(0, k);
    el.appendChild(caret);
    if(k >= total){
      clearInterval(typingTimer);
      el.textContent = full;
      isTyping = false; ready = true;
      setTimeout(done, 300);
    }
  }, 16);
}

/* 点任意处：正在打字 → 立刻显示全文；已显示完 → 出选项 */
function advance(){
  if(G.phase !== 'play') return;
  beep('tap');
  if(isTyping){
    if(typingTimer) clearInterval(typingTimer);
    const sc = SCENES[G.i];
    const full = (sc.line ? sc.line : '') + (sc.reply ? (sc.line ? '\n\n' : '') + sc.reply : '');
    $('dlg-body').textContent = full;
    isTyping = false; ready = true;
    showChoices();
    return;
  }
  if(!ready){ return; }
  showChoices();
}

function showChoices(){
  if(!ready) return;
  ready = false;
  $('continueBtn').classList.remove('show');
  const sc = SCENES[G.i];
  const box = $('choices');
  box.innerHTML = '';
  sc.choices.forEach((c, n) => {
    const b = document.createElement('button');
    b.className = 'choice';
    b.dataset.k = String.fromCharCode(65+n);
    const sub = c.sub ? `<small>${esc(c.sub)}</small>` : '';
    b.innerHTML = `<b>${esc(c.t)}</b>${sub}<span class="fx">${previewFx(c)}</span>`;
    b.onclick = ev => { ev.stopPropagation(); beep('pick'); pick(n); };
    box.appendChild(b);
  });
  box.classList.add('on');
}

/* 后果预览：只说方向和大概，不给数字（保留"选了才知道有多痛"的感觉） */
function previewFx(c){
  const out = [];
  const NM = { study:'学业', mood:'心情', energy:'精力', conf:'自信', rep:'口碑' };
  if(c.fx) for(const k in c.fx){
    const v = c.fx[k]; if(!v) continue;
    out.push(`<i class="${v>0?'up':'dn'}">${NM[k]}${Math.abs(v)>=6?(v>0?'↑↑':'↓↓'):(v>0?'↑':'↓')}</i>`);
  }
  if(typeof c.rep === 'number' && c.rep && !(c.fx && c.fx.rep)){
    out.push(`<i class="${c.rep>0?'up':'dn'}">口碑${Math.abs(c.rep)>=6?(c.rep>0?'↑↑':'↓↓'):(c.rep>0?'↑':'↓')}</i>`);
  }
  if(c.inf){
    const pos = [], neg = [];
    for(const k in c.inf){
      const v = c.inf[k]; if(!v) continue;
      (v>0 ? pos : neg).push(CAST[k] ? CAST[k].name : k);
    }
    if(pos.length) out.push(`<i class="rp">靠近 ${pos.slice(0,2).join('、')}</i>`);
    if(neg.length) out.push(`<i class="rn">得罪 ${neg.slice(0,2).join('、')}</i>`);
  }
  if(!out.length) return '<i class="rp">看不出变化</i>';
  return out.join('');
}

/* ================= 做选择 ================= */
function pick(n){
  if(G.phase !== 'play') return;
  const sc = SCENES[G.i];
  const c = sc.choices[n];
  $('choices').classList.remove('on');
  if(!c) return;
  if(c.end){ showEnding(); return; }

  const dstat = {};
  if(c.fx) for(const k in c.fx){ dstat[k] = c.fx[k]; G.stats[k] = clamp(G.stats[k] + c.fx[k], 0, 100); }
  if(typeof c.rep === 'number'){ dstat.rep = (dstat.rep||0) + c.rep; G.stats.rep = clamp(G.stats.rep + c.rep, 0, 100); }
  if(c.inf) for(const k in c.inf){ G.inf[k] = clamp((G.inf[k]||0) + c.inf[k], -60, 80); }
  const kb = KEY_BEATS[sc.id + ':' + n];
  if(kb) (G.beats = G.beats || []).push(kb);
  if(KEY_SILENT.indexOf(sc.id + ':' + n) >= 0) (G.silent = G.silent || []).push(sc.id);

  if(typeof c.log === 'string'){
    G.log.push({ t: sc.time, x: c.log });
    G.done.push({ t: sc.time, pick: c.t });
  }
  syncStats(false, dstat);
  renderWall();
  flashDelta(dstat, c.t);
  beep(chime(dstat));

  G.i++;
  saveGame();
  if(G.i >= SCENES.length) showEnding();
  else setTimeout(render, 640);
}

function chime(d){
  const ks = Object.keys(d).filter(k => d[k]);
  if(!ks.length) return 'tap';
  const sum = ks.reduce((a,k)=>a+d[k],0);
  return sum > 0 ? 'good' : 'bad';
}

/* 选完之后的过场小卡 */
function flashDelta(d, choiceText){
  const keys = Object.keys(d).filter(k => d[k]);
  if(!keys.length && !choiceText) return;
  const NM = { study:['📖','学业'], mood:['💛','心情'], energy:['⚡','精力'], conf:['💪','自信'], rep:['👀','口碑'] };
  const s = document.createElement('div');
  s.className = 'deltacard';
  s.innerHTML = `<div class="dh">你选择了</div>` +
    (choiceText ? `<div class="dp">${esc(choiceText)}</div>` : '') +
    (keys.length ? `<div class="dd">${keys.map(k => `<span class="dl ${d[k]>0?'up':'dn'}">${NM[k][0]} ${NM[k][1]} ${d[k]>0?'+':''}${d[k]}</span>`).join('')}</div>` : '');
  const w = $('delta');
  w.innerHTML = '';
  w.appendChild(s);
  requestAnimationFrame(() => s.classList.add('on'));
  setTimeout(() => {
    s.classList.remove('on');
    setTimeout(() => { if(s.parentNode) s.remove(); }, 500);
  }, 1700);
}

}

function showRel(k){
  const c = CAST[k], v = G.inf[k];
  let verdict, vc;
  if(v >= 20){ verdict = '他现在站在你这边。'; vc='var(--green)'; }
  else if(v >= 8){ verdict = '他开始把你当朋友了。'; vc='var(--green)'; }
  else if(v <= -20){ verdict = '你们之间结下了梁子。'; vc='var(--red)'; }
  else if(v <= -8){ verdict = '他正在离你远去。'; vc='var(--red)'; }
  else { verdict = '你们之间还是那样，不好不坏。'; vc='var(--gold)'; }
  openSheet(`
  <div class="sheet-scroll">
    <div class="rel-top">
      <div class="rel-av">${faceHTML(c.face,92)}</div>
      <div class="rel-n">${c.name}</div>
      <div class="rel-tag">${c.tag}</div>
      <div class="rel-meter"><i style="width:${Math.min(100,Math.abs(v)/60*100)}%;background:${vc}"></i></div>
      <div class="rel-v" style="color:${vc}">今天：${v>0?'+':''}${v}　<span>${verdict}</span></div>
    </div>
    <div class="sc-card"><h3>他/她是这样的人</h3><p>${REL_DESC[k]||'（还不知道）'}</p></div>
    <button class="btn-big alt" onclick="closeSheet()">知道了</button>
  </div>`, 'sheet-rel');
}

function toggleJ(){
  const b = $('journal'), a = $('jarrow');
  const open = b.style.display !== 'none';
  b.style.display = open ? 'none' : 'block';
  a.textContent = open ? '▸' : '▾';
  if(!open) b.scrollTop = b.scrollHeight;
}
function renderJournal(){
  $('journal').innerHTML = G.log.length
    ? G.log.map(e => `<div class="jl"><span class="tm">${e.t}</span><span class="tx">${e.x}</span></div>`).join('')
    : '<div style="color:var(--soft);font-size:12.5px">今天还没有记录。选一次就会写下一条。</div>';
}
function askRestart(){
  if(G.phase === 'end'){ location.reload(); return; }
  openSheet(`
  <div class="sheet-scroll">
    <div class="sc-kicker">菜单</div>
    <h1 class="sc-title sm">要重来一次吗</h1>
    <div class="sc-rule"></div>
    <div class="sc-card">
      <h3>现在的进度</h3>
      <p>你走到了 <b>第 ${G.i+1} / ${SCENES.length} 场</b>（${SCENES[G.i] ? SCENES[G.i].time : '--'}），一共做了 <b>${G.done.length}</b> 个决定。<br>
      重来会回到最开始——<b>这个游戏不能存档</b>，所以这一次就没了。</p>
    </div>
    <button class="btn-big" onclick="location.reload()">确认，从头再来</button>
    <button class="btn-big alt" onclick="closeSheet()">继续玩，不要重来</button>
  </div>`, 'sheet-menu');
}
function restart(){ location.reload(); }

/* ================= 结算 ================= */
function pickEnding(){
  const S = G.stats, I = G.inf;
  const told  = G.beats.filter(b => b === 'told').length;   // 把事告诉了大人
  const spoke = G.beats.filter(b => b === 'spoke').length;  // 当面说了真话
  const silent= G.silent.length;                            // 一路憋着没说
  const open  = told + spoke;                               // 总共"开口"的次数

  /* ① 心情见底 —— 不管别的怎么样，这一条最优先 */
  if(S.mood <= 30) return 'broken';

  /* ② 最好的结局：真找了大人 + 当面说了不 + 心情没垮 + 成绩没掉 + 口碑还在 */
  if(told >= 2 && spoke >= 1 && S.mood >= 55 && S.study >= 52 && S.rep >= 45) return 'bright';
  if(told >= 3 && S.mood >= 60 && S.study >= 55) return 'bright';

  /* ③ 路走歪了：跟着大壮走，成绩和口碑一起掉下去 */
  if(I.dashuang >= 14 && S.study <= 45) return 'drift';
  if(S.study <= 42 && S.rep <= 30) return 'drift';
  if(S.study <= 32 && I.dashuang >= 8) return 'drift';
  if(I.dashuang >= 20 && S.study <= 42) return 'drift';

  /* ④ 举报太多，全班都躲着你 */
  if(S.rep <= 32 && told >= 3) return 'lonely';
  if(S.rep <= 22) return 'lonely';

  /* ⑤ 一件事都没说，全烂在肚子里 —— 这个游戏最想让你看见的结局 */
  if(silent >= 3 && S.mood <= 50) return 'silent';
  if(open === 0) return 'silent';
  if(S.study <= 40 && silent >= 2) return 'silent';
  if(silent >= 2 && S.mood <= 55) return 'silent';

  /* ⑥ 稳住了 */
  if(told >= 2 && S.mood >= 50) return 'steady';
  if(S.study >= 45 && S.conf >= 45) return 'steady';
  if(open >= 1) return 'steady';
  return 'mixed';
}

function showEnding(forcedKey){
  clearSave();
  G.phase = 'end';
  beep('end');
  const e = ENDINGS[forcedKey || pickEnding()];
  const S = G.stats, I = G.inf;

  const bars = STATS.map(s => {
    const v = Math.round(S[s.k]);
    const low = v < 45;
    return `<button class="ebar" onclick="showStatDesc('${s.k}')">
      <span class="en">${s.i} ${s.n}</span>
      <span class="etrack"><i style="width:${v}%;background:${s.c}"></i><em style="left:${v}%"></em></span>
      <span class="ev ${low?'low':''}">${v}</span></button>`;
  }).join('');

  const people = Object.keys(I).map(k => {
    const v = I[k], c = CAST[k];
    let tag, tcls;
    if(v >= 20){ tag = '他会站在你这边'; tcls='g'; }
    else if(v >= 8){ tag = '你多了个朋友'; tcls='g'; }
    else if(v <= -20){ tag = '你们结下了梁子'; tcls='r'; }
    else if(v <= -8){ tag = '他离你远了一点'; tcls='r'; }
    else { tag = '就那样吧'; tcls='y'; }
    return `<button class="co" onclick="showRel('${k}')">
      <span class="co-av">${faceHTML(c.face,46)}</span>
      <span class="co-main"><span class="co-name">${c.name}<em class="${tcls}">${tag}</em></span>
      <span class="co-txt">${c.tag} · 距离 ${v>0?'+':''}${v}</span></span></button>`;
  }).join('');

  const done = G.done.map((d,i) => `<div class="jt"><span class="jt-t">${d.t}</span><span class="jt-p">${d.pick}</span></div>`).join('');

  openSheet(`
  <div class="sheet-scroll">
    <div class="end-stamp">${e.kicker}</div>
    <h1 class="sc-title sm">${e.title}</h1>
    <div class="sc-rule"></div>
    <div class="sc-card"><div class="verdict">${e.body.replace(/\n/g,'<br>')}</div></div>

    <div class="sc-card">
      <h3>今天结束时的你</h3>
      <div class="ebars">${bars}</div>
      <p class="tiny">点任意一条，看它是什么意思</p>
    </div>

    <div class="sc-card">
      <h3>今天你开口了几次</h3>
      <div class="opening">
        <div class="op-n ${G.beats.filter(x=>x==='told').length>=2?'good':''}">${G.beats.filter(x=>x==='told').length}</div>
        <div class="op-l">次把事情告诉了大人<br><span>（老师、妈妈、爸爸，谁都行）</span></div>
      </div>
      <div class="opening">
        <div class="op-n ${G.silent.length>=4?'bad':''}">${G.silent.length}</div>
        <div class="op-l">次一个人憋着，谁都没说<br><span>${G.silent.length>=4?'这是今天最重要的一件事':'还行，不算多'}</span></div>
      </div>
    </div>

    <div class="sc-card">
      <h3>你今天做的 ${G.done.length} 个决定</h3>
      <div class="jtrace">${done}</div>
    </div>

    <div class="sc-card">
      <h3>今天围绕我的人</h3>
      <div class="cos">${people}</div>
    </div>

    <div class="sc-card sc-card-dark">
      <h3>最后一句真的</h3>
      <p>如果现实里真的有人在打你、踹你、威胁你——<br>
      <b>去找一个大人</b>：老师、妈妈、爸爸，谁都行。<br><br>
      这不是打小报告，这是<b>求救</b>。<br>
      一个人扛着不说的那个人，才是最难的。<br><br>
      <span class="dim">你不用一直很厉害。你只需要在需要的时候开口。</span></p>
    </div>

    <div class="sc-card">
      <h3>再来一次？</h3>
      <p>同样的 14 场，44 个选择。<em>这一次你可以试试第一场就顶嘴，或者在第 9 场一脚踢回去</em>——
      代价是完全不一样的。</p>
    </div>

    <button class="btn-big" onclick="restart()">再活一次这一天 ↺</button>
    <p class="fine">共 ${SCENES.length} 个场景 · ${SCENES.reduce((a,s)=>a+s.choices.length,0)} 个不同选择</p>
  </div>`, 'sheet-end');
}

/* ================= 启动 ================= */
if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
else boot();
function boot(){ buildHUD(); newGame(); }
</script>
